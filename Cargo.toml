[package]
name = "tikvd"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
tikv-client = { path = "vendor/tikv-client", default-features = false }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
etcd-client = "0.14"
